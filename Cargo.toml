[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yazouv/BoringWindows"
rust-version = "1.92"

[workspace.dependencies]
bw-core = { path = "crates/bw-core" }
bw-config = { path = "crates/bw-config" }
bw-claude = { path = "crates/bw-claude" }
bw-media = { path = "crates/bw-media" }
bw-calendar = { path = "crates/bw-calendar" }
bw-i18n = { path = "crates/bw-i18n" }
bw-net = { path = "crates/bw-net" }
bw-update = { path = "crates/bw-update" }
bw-secrets = { path = "crates/bw-secrets" }
bw-timer = { path = "crates/bw-timer" }
bw-volume = { path = "crates/bw-volume" }
bw-viz = { path = "crates/bw-viz" }
bw-plugins = { path = "crates/bw-plugins" }
bw-notify = { path = "crates/bw-notify" }
bw-weather = { path = "crates/bw-weather" }
bw-power = { path = "crates/bw-power" }
bw-presence = { path = "crates/bw-presence" }
bw-system = { path = "crates/bw-system" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
toml = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Moins d'infos de debug : builds, link et cache CI plus légers.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
# LTO « thin » et codegen-units par défaut : mesuré sur 4 cœurs, compilation
# 334 s au lieu de 544 s (172 s au lieu de 353 s avec les dépendances en
# cache), pour un binaire compressé 10 % plus gros (14,6 Mo au lieu de 13,2).
# Les minutes de la CI de release coûtent plus cher que ces 1,4 Mo.
lto = "thin"
panic = "abort"
strip = true
