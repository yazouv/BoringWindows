[book]
title = "BoringWindows"
description = "Une Dynamic Island pour Windows : Claude Code, musique, agenda."
authors = ["BoringWindows"]
language = "fr"
src = "src"

[build]
build-dir = "../book"

[output.html]
git-repository-url = "https://github.com/yazouv/BoringWindows"
edit-url-template = "https://github.com/yazouv/BoringWindows/edit/main/docs/fr/{path}"
site-url = "/BoringWindows/"
default-theme = "navy"
preferred-dark-theme = "navy"
no-section-label = true
additional-js = ["lang.js"]
additional-css = ["lang.css"]

[output.html.search]
enable = true
