# Configuration de BoringWindows.
# Sauvegarde ce fichier : l'île se met à jour instantanément.

[general]
# Langue de l'interface : "auto" (celle de Windows), "fr" ou "en".
language = "auto"
# Écran de l'île : "primary" (écran principal) ou "cursor" (écran sous la souris au lancement).
monitor = "primary"
# Cache l'île quand une appli est en plein écran (jeu, vidéo, présentation).
hide_in_fullscreen = true
# Ouverture de l'île : "hover" (survol) ou "click".
open_on = "hover"
# Délai avant de refermer l'île quand la souris s'en va (ms).
collapse_delay_ms = 350
# Installer automatiquement les nouvelles versions (releases GitHub).
auto_update = true

[theme]
# Thème : "auto" (suit le mode clair ou sombre de Windows), "default" (noir),
# "light" (clair), "midnight" (bleu nuit), "glass" (verre fumé, flouté), ou le nom
# d'un fichier themes/<nom>.toml placé à côté de ce fichier.
name = "default"
# Les clés suivantes remplacent celles du thème : décommente pour personnaliser.
# Couleurs au format "#RRGGBB" ou "#RRGGBBAA".
# background = "#000000"
# foreground = "#FFFFFF"
# accent = "#FF8A3D"
# border = "#00000000"        # contour de l'île (transparent : aucun)
# font = "Segoe UI"           # police (par défaut : celle du système)
# corner_radius = 22.0        # coins de l'île ouverte (la pilule reste ronde)
# blur = false               # flou derrière l'île (Windows ; fond translucide)
# Halo animé autour de l'île pendant que Claude travaille ou t'attend.
glow = true
# Durée des animations (ms). 0 = pas d'animation.
animation_ms = 240
# Décalage depuis le haut de l'écran (px).
top_offset = 0.0
# Couleur d'accent de Windows à la place de celle du thème.
system_accent = false

[theme.compact]
width = 190.0
height = 32.0

[theme.attention]
# Taille de la pilule quand un module réclame l'attention.
width = 300.0
height = 36.0

[theme.expanded]
width = 580.0
height = 170.0

[layout]
# Ordre de priorité des modules quand plusieurs réclament l'attention en même temps.
compact = ["claude", "media", "calendar"]

[hotkeys]
# Raccourcis clavier valables partout, ex. "Ctrl+Alt+B" ou "Ctrl+Shift+F9" ("" : aucun).
# Modificateurs : Ctrl, Alt, Shift, Super (touche Windows, Cmd sur Mac).
# Touches : A à Z, 0 à 9, F1 à F24, Space, Up, Down, Left, Right, Home, End…
# Ouvrir ou refermer l'île.
toggle = "Ctrl+Alt+B"
# Musique : lecture / pause, morceau suivant, morceau précédent.
play_pause = ""
next_track = ""
previous_track = ""
# Activer ou couper « ne pas déranger ».
do_not_disturb = ""

# Chaque module se configure dans sa section [modules.<nom>].
# Un module avec enabled = false n'est même pas démarré.

[modules.claude]
# Statut de Claude Code. Installer les hooks : clic droit sur l'icône de notification.
enabled = true
# Répondre aux demandes de permission depuis l'île.
permissions = true
# Temps laissé pour répondre dans l'île avant de rendre la main au terminal (s, max 280).
permission_wait_secs = 60
# Durée d'affichage de « terminé » (s).
done_secs = 8
# Son système quand Claude se met à t'attendre (question, plan, permission).
sound = true

[modules.media]
# Musique en cours (Spotify, Apple Music, navigateurs, VLC…) via les contrôles média de Windows.
enabled = true
# Teinter l'île avec la couleur de la pochette.
accent_from_artwork = true
# Sources à ignorer (morceau de nom, ex. ["chrome", "msedge"]).
ignore = []

[modules.calendar]
# Prochaines réunions, rappel avant le début et bouton « Rejoindre » (Teams, Meet, Zoom…).
enabled = true
# Prévenir combien de minutes avant le début.
remind_minutes = 5
# Rafraîchissement (minutes).
refresh_minutes = 10
show_all_day = true
# Ajoute un bloc par calendrier, avec son lien ICS privé :
#  - Google : Paramètres › (ton agenda) › « Adresse secrète au format iCal »
#  - Outlook / Microsoft 365 : Paramètres › Calendrier › Calendriers partagés › Publier › lien ICS
#  - iCloud : Partager le calendrier › Calendrier public › copier le lien (webcal://)
# [[modules.calendar.sources]]
# name = "Pro"
# url = "https://outlook.office365.com/owa/calendar/…/calendar.ics"

[modules.notifications]
# Notifications des applications (Discord, Slack, Teams…) : chacune s'annonce
# dans l'île, et les dernières restent dans l'onglet « Notifs ».
enabled = true
# Durée d'affichage d'une nouvelle notification (s).
show_secs = 5
# Montrer l'expéditeur et le message ; sinon, seulement le nom de l'application.
show_content = true
# Applications à ignorer (morceau de nom, ex. ["docker", "intel"]).
ignore = []
# Un clic sur une notification de l'île rejoue la vraie notification (bon salon
# Discord, bon onglet…) ; false : il ouvre seulement l'application.
open_original = true

[modules.battery]
# Batterie du PC : branchement du chargeur, charge terminée, batterie faible.
enabled = true
# Durée d'affichage (s).
show_secs = 4
# Seuil de batterie faible (%), rappelé à la moitié du seuil.
low_percent = 20

[modules.bluetooth]
# Appareils Bluetooth : connexion avec leur niveau de batterie (casque,
# écouteurs, souris…), déconnexion, batterie faible.
enabled = true
show_secs = 4
low_percent = 20

[modules.weather]
# Météo du moment à côté de la date (open-meteo.com, sans compte).
enabled = false
# Ville (ex. "Lyon" ou "Lyon, France"), ou latitude/longitude à la place.
city = ""
# latitude = 45.76
# longitude = 4.84
# Unité : "celsius" ou "fahrenheit".
units = "celsius"
# Rafraîchissement (minutes).
refresh_minutes = 30

[modules.system]
# Processeur et mémoire à côté de l'heure dans l'île ouverte (détail au survol).
enabled = true
# Rafraîchissement pendant que l'île est ouverte (s, de 1 à 10). Île fermée,
# rien n'est mesuré, sauf si une alerte est réglée.
refresh_secs = 2
# Alerte dans la pilule quand le processeur ou la mémoire reste au-dessus de ce
# seuil (%, de 50 à 100), avec l'application en cause ; 0 = pas d'alerte.
cpu_alert_percent = 0
ram_alert_percent = 0
# Durée au-dessus du seuil avant l'alerte (s).
alert_after_secs = 30

[modules.mascot]
# La mascotte : un petit blob dans la pilule qui réagit à Claude Code, danse sur
# la musique, s'endort quand tu t'absentes et se déguise selon la saison.
enabled = true
# Toujours animée (respire, cligne des yeux) ; sinon seulement quand il se passe
# quelque chose, pour que l'île ne consomme rien au repos.
always_animated = false
# Danser au rythme des basses quand la musique joue.
music = true
# Déguisements et décorations (Halloween, Noël, Nouvel An).
seasonal = true
# Minutes sans clavier ni souris avant qu'elle s'endorme.
sleep_after_minutes = 10
# Accessoire de la grande mascotte (île ouverte) : "sprout" (pousse), "glasses"
# (lunettes), "headphones" (casque), "bow" (nœud) ou "none".
accessory = "sprout"
# Couleur du corps, comme "#FFB3C7" ; vide : celle du texte du thème.
color = ""

[modules.gestures]
# Gestes sur l'île : molette pour le volume, glisser (pavé tactile, Maj + molette
# ou souris) pour changer de morceau, appui long pour « ne pas déranger ».
enabled = true
# Pas de volume par cran de molette (%).
volume_step = 2

[modules.presentation]
# Pendant un appel ou un partage d'écran : rien ne s'annonce et un point rouge
# s'affiche dans la pilule.
enabled = true
# L'île n'apparaît pas dans les partages d'écran, enregistrements et captures
# (les tiennes comprises).
hide_from_capture = true
# Applications dont l'usage du micro veut dire « en appel » (morceau de nom).
call_apps = ["teams", "discord", "zoom", "slack", "webex", "skype", "chrome", "msedge", "firefox", "brave", "opera", "obs"]

[modules.demo]
# Module de démonstration : fait varier l'attention toutes les quelques secondes
# pour tester les animations. À désactiver une fois les vrais modules en place.
enabled = false
