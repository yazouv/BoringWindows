# BoringWindows configuration.
# Save this file: the island updates instantly.

[general]
# Interface language: "auto" (the one of Windows), "fr" or "en".
language = "auto"
# Island screen: "primary" (main screen) or "cursor" (screen under the mouse at startup).
monitor = "primary"
# Hide the island when an app is full screen (game, video, presentation).
hide_in_fullscreen = true
# Opening the island: "hover" or "click".
open_on = "hover"
# Delay before closing the island when the mouse leaves (ms).
collapse_delay_ms = 350
# Install new versions automatically (GitHub releases).
auto_update = true

[theme]
# Theme: "auto" (follows the light or dark mode of Windows), "default" (black),
# "light", "midnight" (midnight blue), "glass" (smoked glass, blurred), or the name
# of a themes/<name>.toml file next to this file.
name = "default"
# The following keys override the theme's: uncomment to customize.
# Colors as "#RRGGBB" or "#RRGGBBAA".
# background = "#000000"
# foreground = "#FFFFFF"
# accent = "#FF8A3D"
# border = "#00000000"        # island border (transparent: none)
# font = "Segoe UI"           # font (default: the system font)
# corner_radius = 22.0        # corners of the open island (the pill stays round)
# blur = false               # blur behind the island (Windows; translucent background)
# Animated glow around the island while Claude works or waits for you.
glow = true
# Animation duration (ms). 0 = no animation.
animation_ms = 240
# Offset from the top of the screen (px).
top_offset = 0.0
# Accent color of Windows instead of the theme's.
system_accent = false

[theme.compact]
width = 190.0
height = 32.0

[theme.attention]
# Pill size when a module asks for attention.
width = 300.0
height = 36.0

[theme.expanded]
width = 580.0
height = 170.0

[layout]
# Priority order of modules when several ask for attention at the same time.
compact = ["claude", "media", "calendar"]

[hotkeys]
# Keyboard shortcuts that work everywhere, e.g. "Ctrl+Alt+B" or "Ctrl+Shift+F9" ("": none).
# Modifiers: Ctrl, Alt, Shift, Super (Windows key, Cmd on a Mac).
# Keys: A to Z, 0 to 9, F1 to F24, Space, Up, Down, Left, Right, Home, End…
# Open or close the island.
toggle = "Ctrl+Alt+B"
# Music: play / pause, next track, previous track.
play_pause = ""
next_track = ""
previous_track = ""
# Turn "do not disturb" on or off.
do_not_disturb = ""

# Each module is configured in its [modules.<name>] section.
# A module with enabled = false is not even started.

[modules.claude]
# Claude Code status. Install the hooks: right-click the notification area icon.
enabled = true
# Answer permission requests from the island.
permissions = true
# Time left to answer in the island before handing back to the terminal (s, max 280).
permission_wait_secs = 60
# How long "done" stays (s).
done_secs = 8
# System sound when Claude starts waiting for you (question, plan, permission).
sound = true

[modules.media]
# Music now playing (Spotify, Apple Music, browsers, VLC…) through Windows media controls.
enabled = true
# Tint the island with the album art color.
accent_from_artwork = true
# Sources to ignore (part of a name, e.g. ["chrome", "msedge"]).
ignore = []

[modules.calendar]
# Upcoming meetings, reminder before they start and "Join" button (Teams, Meet, Zoom…).
enabled = true
# Remind how many minutes before the start.
remind_minutes = 5
# Refresh interval (minutes).
refresh_minutes = 10
show_all_day = true
# Add one block per calendar, with its private ICS link:
#  - Google: Settings › (your calendar) › "Secret address in iCal format"
#  - Outlook / Microsoft 365: Settings › Calendar › Shared calendars › Publish › ICS link
#  - iCloud: Share calendar › Public Calendar › copy the link (webcal://)
# [[modules.calendar.sources]]
# name = "Work"
# url = "https://outlook.office365.com/owa/calendar/…/calendar.ics"

[modules.notifications]
# App notifications (Discord, Slack, Teams…): each one shows up in the
# island, and the latest stay in the "Notifs" tab.
enabled = true
# How long a new notification stays (s).
show_secs = 5
# Show the sender and the message; otherwise, only the app name.
show_content = true
# Apps to ignore (part of a name, e.g. ["docker", "intel"]).
ignore = []
# Clicking a notification in the island replays the real one (right Discord
# channel, right tab…); false: it only opens the app.
open_original = true

[modules.battery]
# PC battery: charger plugged in or out, fully charged, low battery.
enabled = true
# How long it stays (s).
show_secs = 4
# Low battery threshold (%), reminded again at half the threshold.
low_percent = 20

[modules.bluetooth]
# Bluetooth devices: connection with their battery level (headphones,
# earbuds, mouse…), disconnection, low battery.
enabled = true
show_secs = 4
low_percent = 20

[modules.weather]
# Current weather next to the date (open-meteo.com, no account).
enabled = false
# City (e.g. "Lyon" or "Lyon, France"), or latitude/longitude instead.
city = ""
# latitude = 45.76
# longitude = 4.84
# Unit: "celsius" or "fahrenheit".
units = "celsius"
# Refresh interval (minutes).
refresh_minutes = 30

[modules.system]
# CPU and memory next to the time in the open island (details on hover).
enabled = true
# Refresh while the island is open (s, 1 to 10). While it is closed, nothing
# is measured, unless an alert is set.
refresh_secs = 2
# Alert in the pill when the CPU or the memory stays above this threshold
# (%, 50 to 100), naming the app responsible; 0 = no alert.
cpu_alert_percent = 0
ram_alert_percent = 0
# Time above the threshold before the alert (s).
alert_after_secs = 30

[modules.mascot]
# The mascot: a little blob in the pill that reacts to Claude Code, dances to
# the music, falls asleep when you are away and dresses up for the season.
enabled = true
# Always animated (breathes, blinks); otherwise only when something happens,
# so that the island uses nothing at rest.
always_animated = false
# Dance to the bass while music plays.
music = true
# Costumes and decorations (Halloween, Christmas, New Year).
seasonal = true
# Minutes without keyboard or mouse before it falls asleep.
sleep_after_minutes = 10
# Accessory of the big mascot (open island): "sprout", "glasses",
# "headphones", "bow" or "none".
accessory = "sprout"
# Body color, like "#FFB3C7"; empty: the theme's text color.
color = ""

[modules.gestures]
# Gestures on the island: wheel for volume, swipe (touchpad, Shift + wheel or
# mouse) to change track, long press for "do not disturb".
enabled = true
# Volume step per wheel notch (%).
volume_step = 2

[modules.presentation]
# During a call or screen sharing: nothing pops up and a red dot shows in the
# pill.
enabled = true
# The island doesn't appear in screen sharing, recordings and screenshots
# (including yours).
hide_from_capture = true
# Apps whose use of the microphone means "in a call" (part of a name).
call_apps = ["teams", "discord", "zoom", "slack", "webex", "skype", "chrome", "msedge", "firefox", "brave", "opera", "obs"]

[modules.demo]
# Demo module: changes attention every few seconds to try out the
# animations. Turn it off once the real modules are set up.
enabled = false
