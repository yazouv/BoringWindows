[package]
name = "bw-media"
description = "Musique en cours pour BoringWindows (contrôles média du système)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bw-i18n.workspace = true
anyhow.workspace = true
bw-core.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
log.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
] }

[target.'cfg(target_os = "macos")'.dependencies]
bw-net.workspace = true
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSRunningApplication",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFDate",
    "CFRunLoop",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
] }

[lints]
workspace = true
