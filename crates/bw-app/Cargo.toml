[package]
name = "bw-app"
description = "BoringWindows : une Dynamic Island pour Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "boringwindows"
path = "src/main.rs"

[dependencies]
bw-i18n.workspace = true
anyhow.workspace = true
bw-calendar.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bw-claude.workspace = true
bw-config.workspace = true
bw-core.workspace = true
bw-media.workspace = true
bw-notify.workspace = true
bw-power.workspace = true
bw-presence.workspace = true
bw-system.workspace = true
bw-weather.workspace = true
bw-timer.workspace = true
bw-volume.workspace = true
bw-viz.workspace = true
bw-plugins.workspace = true
bw-update.workspace = true
bw-secrets.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log.workspace = true
slint = { version = "~1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "unstable-winit-030",
] }
slint-interpreter = { version = "~1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "internal",
] }
serde.workspace = true
tokio.workspace = true
toml.workspace = true
global-hotkey = { version = "0.8", default-features = false }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "objc2-core-foundation",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSSound",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSDistributedNotificationCenter",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
    "NSUserDefaults",
] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "UI",
    "UI_ViewManagement",
    "Win32_Foundation",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "~1.18"

[lints]
workspace = true
