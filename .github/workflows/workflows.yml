name: Workflows

# Vérifie les workflows eux-mêmes quand ils changent :
# - actionlint : syntaxe, expressions, scripts shell (shellcheck) ;
# - zizmor : failles propres à GitHub Actions (injection de `${{ }}` dans un
#   script, jetons trop larges, identifiants laissés dans .git, actions non
#   épinglées…).
on:
  pull_request:
    branches: [main]
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: read

concurrency:
  group: workflows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Résultats dans le journal du run (pas d'envoi à l'onglet Security :
      # les PR de forks n'ont pas ce droit).
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
