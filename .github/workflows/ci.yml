name: CI

# Format, clippy et tests.
#
# Runner : le runner auto-hébergé (`self-hosted`) pour main et les PR venant de
# ce dépôt. Son dossier de compilation est conservé d'un run à l'autre : seuls
# les fichiers modifiés sont recompilés, sans cache à télécharger.
# Les PR venant de forks tournent sur les runners de GitHub : le dépôt est
# public, et un runner auto-hébergé exécuterait le code de n'importe qui sur
# la machine qui l'héberge.
on:
  # Toujours sur les PR (un check obligatoire doit pouvoir passer) ; sur main,
  # pas pour la doc seule.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

# Lecture seule : les PR venant de forks n'ont accès à rien d'autre.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Les PR de release-please ne changent que la version, le CHANGELOG et
    # Cargo.lock : le code a déjà été vérifié sur sa propre PR. Job sauté
    # (compté comme réussi si le check est obligatoire).
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted' || 'ubuntu-latest' }}
    env:
      # Auto-hébergé : compilation hors du dossier de travail (que `checkout`
      # nettoie), conservée entre les runs.
      CARGO_TARGET_DIR: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('{0}/../bw-target', github.workspace) || format('{0}/target', github.workspace) }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if pkg-config --exists fontconfig xkbcommon 2>/dev/null; then exit 0; fi
          # `-n` : jamais d'invite de mot de passe (le job échouerait au lieu d'attendre).
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # Depuis Linux, clippy vérifie aussi les types pour Windows et macOS.
          targets: ${{ runner.os == 'Linux' && 'x86_64-pc-windows-msvc, aarch64-apple-darwin' || '' }}

      # Cache seulement sur les runners de GitHub (machines neuves à chaque run).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-on-failure: true

      - run: cargo fmt --all --check
      - name: clippy (système du runner)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (Windows)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: clippy (macOS)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings
      - run: cargo test --workspace --locked
