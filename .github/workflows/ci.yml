name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Empreinte au repos
        # Indicatif : le runner n'a pas de GPU, le rendu passe par le pilote logiciel.
        continue-on-error: true
        shell: pwsh
        run: ./scripts/measure-idle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: boringwindows-windows-x64
          path: target/release/boringwindows.exe

  linux:
    # La logique (core, config, géométrie) se teste partout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
