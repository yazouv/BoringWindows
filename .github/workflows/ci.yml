name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Un nouveau push annule le run précédent de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint + tests (profil dev). Le premier run compile toutes les dépendances
  # (~10 min sous Windows) ; ensuite le cache ne laisse que nos crates à rebuild.
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          # Sauvegarder même si un test échoue, pour ne pas tout recompiler au run suivant.
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Binaires release, en parallèle de `check` avec leur propre cache.
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bin: target/release/boringwindows.exe
          - os: macos-latest
            name: macos-arm64
            bin: target/release/boringwindows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
          cache-on-failure: true
      - run: cargo build --release
      - name: Empreinte au repos
        if: runner.os == 'Windows'
        # Indicatif : le runner n'a pas de GPU, le rendu passe par le pilote logiciel.
        continue-on-error: true
        shell: pwsh
        run: ./scripts/measure-idle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: boringwindows-${{ matrix.name }}
          path: ${{ matrix.bin }}
