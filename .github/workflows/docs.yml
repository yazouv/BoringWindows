name: Docs

# Construit le site sur les PR (une page cassée se voit avant la fusion) et le
# publie depuis main.
on:
  pull_request:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Construit le site à chaque modification (détecte une page cassée).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer mdBook
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Pages identiques en fr et en
        run: |
          cmp docs/fr/lang.js docs/en/lang.js
          cmp docs/fr/lang.css docs/en/lang.css
          diff <(cd docs/fr/src && find . -name '*.md' | sort) <(cd docs/en/src && find . -name '*.md' | sort)
      # Français à la racine du site, anglais dans /en/ (dans cet ordre :
      # chaque build vide son dossier de sortie).
      - run: mdbook build docs/fr
      - run: mdbook build docs/en
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  # Publie sur GitHub Pages, seulement depuis la branche par défaut.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
