name: Release

# À chaque push sur main, release-please tient à jour une PR « chore: release x.y.z »
# (version + CHANGELOG à partir des commits feat:/fix:…). Fusionner cette PR crée
# la release et son tag ; les binaires Windows, macOS et Linux y sont alors attachés
# (build.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Rien par défaut : chaque job demande seulement ce qu'il utilise.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # La PR de release change la version dans Cargo.toml : on aligne Cargo.lock
  # dans la même PR, sinon le premier `cargo build` le modifierait chez chacun.
  # Puis on lance ses checks : une PR ouverte ou poussée avec le GITHUB_TOKEN ne
  # déclenche aucun workflow, et les checks obligatoires bloqueraient la fusion.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      # Rust est déjà installé sur les runners Ubuntu : pas de toolchain à poser.
      - run: cargo update --workspace
      - name: Commit Cargo.lock
        run: |
          if git diff --quiet Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: Cargo.lock à la version de la release"
          gh auth setup-git
          git push
      - name: Checks de la PR de release
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run release-check.yml --ref "$BRANCH"

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag }}
      tag: ${{ needs.release-please.outputs.tag }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  # Liens de téléchargement en tête des notes de version.
  notes:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Téléchargements dans les notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          # L'installeur peut manquer (son étape n'est pas bloquante).
          INSTALLER=""
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx boringwindows-windows-x64-setup.exe; then
            INSTALLER=success
          fi
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          body=$(gh release view "$TAG" --json body -q .body)
          win_rows="| Windows 10/11 (x64) | [boringwindows-windows-x64.exe]($base/boringwindows-windows-x64.exe) |"
          if [ "$INSTALLER" = "success" ]; then
            win_rows="| Windows 10/11 (x64), installeur | [boringwindows-windows-x64-setup.exe]($base/boringwindows-windows-x64-setup.exe) |
          $win_rows"
          fi
          cat > notes.md <<NOTES
          ## Téléchargements

          | Système | Fichier |
          |---|---|
          $win_rows
          | macOS (Apple Silicon) | [boringwindows-macos-arm64.tar.gz]($base/boringwindows-macos-arm64.tar.gz) |
          | macOS (Intel) | [boringwindows-macos-x64.tar.gz]($base/boringwindows-macos-x64.tar.gz) |
          | Linux (x64) | [boringwindows-linux-x64.tar.gz]($base/boringwindows-linux-x64.tar.gz) |

          Déjà installé ? BoringWindows se met à jour tout seul (Réglages › Général).
          Chaque fichier a son empreinte \`.sha256\` et une attestation de provenance :
          \`gh attestation verify <fichier> --repo $GH_REPO\`. macOS : binaire non signé, voir
          la [documentation](https://yazouv.github.io/BoringWindows/installation.html).

          NOTES
          printf '%s\n' "$body" >> notes.md
          gh release edit "$TAG" --notes-file notes.md
